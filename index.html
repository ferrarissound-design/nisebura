<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="ふっとばして場外へ！最大4人で遊べるブラウザ対戦アクション">
<title>NISEBURA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">
  <!-- タイトル -->
  <section class="scr" id="scr-title">
    <div class="logo">
      <div class="logo-main">NISE<span>BURA</span></div>
      <div class="logo-sub">ふっとばし大バトル</div>
    </div>
    <button class="btn press" id="btn-start" data-act="start">タップしてスタート</button>
    <div class="credit">© NISEBURA — オリジナル作品 / 全素材プログラム生成</div>
  </section>

  <!-- メインメニュー -->
  <section class="scr" id="scr-menu">
    <div class="menu-col">
      <h2 class="scr-title">メニュー</h2>
      <button class="btn big" data-act="battle"><b>バトル</b><small>最大4人でふっとばし合い</small></button>
      <button class="btn big" data-act="training"><b>トレーニング</b><small>動かない相手で技の練習</small></button>
      <button class="btn big" data-act="howto"><b>あそびかた</b><small>ルールと操作方法</small></button>
      <button class="btn big" data-act="settings"><b>設定</b><small>音量・画質・タッチ操作</small></button>
    </div>
  </section>

  <!-- キャラ選択 -->
  <section class="scr" id="scr-chars">
    <div class="topbar">
      <button class="btn back" data-act="back">◀</button>
      <h2>キャラクター選択</h2>
      <div class="rules">
        <div class="rule"><span>ストック</span><button class="btn sm" data-act="stock-">◀</button><b id="r-stock">3</b><button class="btn sm" data-act="stock+">▶</button></div>
        <div class="rule"><span>時間</span><button class="btn sm" data-act="time-">◀</button><b id="r-time">なし</b><button class="btn sm" data-act="time+">▶</button></div>
      </div>
      <button class="btn go" data-act="tostage">決定 ▶</button>
    </div>
    <div class="roster" id="roster"></div>
    <div class="slots" id="slots"></div>
  </section>

  <!-- ステージ選択 -->
  <section class="scr" id="scr-stages">
    <div class="topbar">
      <button class="btn back" data-act="back">◀</button>
      <h2>ステージ選択</h2>
    </div>
    <div class="stages" id="stagelist"></div>
  </section>

  <!-- ポーズ -->
  <section class="scr overlay" id="scr-pause">
    <div class="menu-col">
      <h2 class="scr-title">ポーズ</h2>
      <button class="btn big" data-act="resume"><b>つづける</b></button>
      <button class="btn big" data-act="restart"><b>やりなおす</b></button>
      <button class="btn big" data-act="tochars"><b>キャラ選択へ</b></button>
      <button class="btn big" data-act="totitle"><b>タイトルへ</b></button>
    </div>
  </section>

  <!-- 結果 -->
  <section class="scr" id="scr-result">
    <div class="result-wrap">
      <div class="winner">
        <div class="winner-label">WINNER</div>
        <canvas id="win-canvas" width="360" height="360"></canvas>
        <div class="winner-name" id="win-name"></div>
      </div>
      <div class="result-side">
        <table class="rank" id="rank"></table>
        <div class="row">
          <button class="btn big" data-act="again"><b>もう一度</b></button>
          <button class="btn big" data-act="tochars"><b>キャラ選択</b></button>
          <button class="btn big" data-act="totitle"><b>タイトル</b></button>
        </div>
      </div>
    </div>
  </section>

  <!-- 遊び方 -->
  <section class="scr" id="scr-howto">
    <div class="topbar">
      <button class="btn back" data-act="back">◀</button>
      <h2>あそびかた</h2>
    </div>
    <div class="doc" id="howto-doc"></div>
  </section>

  <!-- 設定 -->
  <section class="scr" id="scr-settings">
    <div class="topbar">
      <button class="btn back" data-act="back">◀</button>
      <h2>設定</h2>
    </div>
    <div class="settings" id="settings-list"></div>
  </section>

</div>

<script src="js/util.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/skeleton.js"></script>
<script src="js/moves.js"></script>
<script src="js/characters.js"></script>
<script src="js/projectiles.js"></script>
<script src="js/effects.js"></script>
<script src="js/render-fighter.js"></script>
<script src="js/stages.js"></script>
<script src="js/ai.js"></script>
<script src="js/fighter.js"></script>
<script src="js/battle.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
