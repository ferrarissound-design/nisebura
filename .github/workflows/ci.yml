name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in js/*.js tools/*.js; do node --check "$f"; done
      - name: Touch HUD layout and input
        run: node tools/touch-layout-test.js
      - name: Headless CPU battles
        run: node tools/sim.js 30 7
